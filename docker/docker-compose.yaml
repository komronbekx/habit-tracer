services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile

    container_name: habit-tracer-web

    command: uv run python manage.py runserver 0.0.0.0:8000

    volumes:
      - ..:/app

    ports:
      - "8000:8000"

    env_file:
      - ../.env

    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17

    container_name: habit-tracer-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:


